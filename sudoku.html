    <style>
      /* ---- Sudoku-page chrome, layered on the shared brand system ---- */
      :root {
        color-scheme: light dark;
      }

      /* hide number-input spinners (kept from original) */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 0 1rem 3rem;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-display);
      }

      .app-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(1.6rem, 5vw, 2.4rem);
        letter-spacing: -0.03em;
        text-transform: uppercase;
        margin: 1.75rem 0 0.4rem;
        text-align: center;
      }

      #toptext {
        font-family: var(--font-mono);
        font-size: 0.82rem;
        line-height: 1.55;
        max-width: 40rem;
        margin: 0 auto 1.5rem;
        text-align: center;
        color: var(--ink);
      }
      #toptext strong {
        color: var(--primary);
      }

      /* ---- The grid: 2px brutalist borders, orange offset shadow ---- */
      .board-wrap {
        position: relative;
        margin: 0 auto;
      }
      #sudoku {
        border-collapse: collapse;
        background: var(--surface-1);
        box-shadow: 6px 6px 0 var(--primary);
      }
      #sudoku,
      #sudoku td {
        border: var(--border-w) solid var(--ink);
      }
      #sudoku td {
        width: 3rem;
        height: 3rem;
        padding: 0;
        /* faint inner cell grid via a hairline; collapse keeps block edges bold */
        border-width: 0;
        box-shadow: inset 0 0 0 1px var(--surface-4);
      }
      /* thick separators between the nine 3x3 blocks */
      #sudoku td:nth-child(3n) {
        box-shadow: inset -1px 0 0 var(--ink), inset 0 0 0 1px var(--surface-4);
      }
      #sudoku tr:nth-child(3n) td {
        box-shadow: inset 0 -1px 0 var(--ink), inset 0 0 0 1px var(--surface-4);
      }
      #sudoku tr:nth-child(3n) td:nth-child(3n) {
        box-shadow: inset -1px 0 0 var(--ink), inset 0 -1px 0 var(--ink),
          inset 0 0 0 1px var(--surface-4);
      }

      /* checkerboard tint of 3x3 blocks (kept from original logic) */
      #sudoku .alternate {
        background: var(--surface-2);
      }

      #sudoku input {
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0;
        margin: 0;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 1.2rem;
        font-weight: 500;
        color: var(--ink);
        background: transparent;
        outline: none;
        appearance: none;
      }
      /* locked clue cells read bolder */
      #sudoku input:read-only {
        font-weight: 700;
        color: var(--ink);
      }
      /* active cell: orange fill, WHITE text-on-primary (P2.13) */
      #sudoku input:focus {
        background: var(--primary);
        color: #fff;
      }

      /* ---- Controls: brutalist buttons ---- */
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 1.75rem;
      }
      button {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--surface-1);
        color: var(--ink);
        border: var(--border-w) solid var(--ink);
        padding: 0.6rem 1.1rem;
        cursor: pointer;
        box-shadow: 4px 4px 0 var(--ink);
        transition: transform 0.08s ease, box-shadow 0.08s ease,
          background 0.12s ease, color 0.12s ease;
      }
      button:hover {
        background: var(--primary);
        color: #fff; /* WHITE text-on-primary (P2.13) */
      }
      button:active {
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 var(--ink);
      }
      button:focus-visible {
        outline: var(--border-w) solid var(--primary);
        outline-offset: 2px;
      }
      /* primary action starts filled with the accent */
      button.primary {
        background: var(--primary);
        color: #fff;
      }
      button.primary:hover {
        background: var(--primary-strong);
        color: #fff;
      }

      /* ---- Responsive ---- */
      @media (max-width: 540px) {
        #sudoku td {
          width: 2.4rem;
          height: 2.4rem;
        }
        #sudoku input {
          font-size: 1rem;
        }
        .app-title {
          margin-top: 1.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
        button:active {
          transform: none;
        }
      }

    <h1 class="app-title">SUDOKU</h1>
    <span id="toptext">
      Enter a puzzle and hit <strong>Solve</strong>, or generate a fresh one.
      Generated clues are locked &mdash; fill the rest. Empty cells are blanks.
    </span>

    <div class="board-wrap">
      <!-- Sudoku grid -->
      <table id="sudoku"></table>
    </div>

    <div class="controls">
      <button id="generate" class="primary" type="button">Generate New Puzzle</button>
      <button id="solve" type="button">Solve Sudoku</button>
      <button id="clear" type="button">Clear Grid</button>
    </div>

    <!-- Puzzle generator: classic script, exposes window.SudokuGenerator (P4.7) -->
    <script src="sudoku%20generator.js"></script>

    <script>
      // JavaScript code for generating the Sudoku grid, solving the Sudoku,
      // generating a new puzzle, and clearing the grid.

      /**
       * Generates the Sudoku grid and adds it to the HTML table.
       */
      const table = document.getElementById("sudoku");
      for (let i = 0; i < 9; i++) {
        const row = document.createElement("tr");
        for (let j = 0; j < 9; j++) {
          const cell = document.createElement("td");
          const input = document.createElement("input");
          input.type = "number";
          input.min = 1;
          input.max = 9;
          input.id = `cell-${i}-${j}`; // Assign an ID to the input element

          // Add event listener
          input.addEventListener("input", function () {
            if (input.value > 9) {
              input.value = ""; // Clear the input field if the user enters a number greater than 9
            } else if (input.value == 0) {
              input.value = ""; // Clear the input field if the user enters 0
            }
            if (input.value !== "") {
              let nextCell;
              if (j < 8) {
                // If it's not the last cell in the row
                nextCell = document.getElementById(`cell-${i}-${j + 1}`);
              } else if (i < 8) {
                // If it's not the last row
                nextCell = document.getElementById(`cell-${i + 1}-0`);
              }
              if (nextCell) {
                nextCell.focus();
              }
            }
          });
          input.addEventListener("keydown", function (event) {
            if (event.key === "Backspace" && input.value === "") {
              let previousCell;
              if (j > 0) {
                // If it's not the first cell in the row
                previousCell = document.getElementById(`cell-${i}-${j - 1}`);
              } else if (i > 0) {
                // If it's not the first row
                previousCell = document.getElementById(`cell-${i - 1}-8`);
              }
              if (previousCell) {
                previousCell.focus();
              }
              event.preventDefault(); // Prevent the default action
            }
          });
          cell.appendChild(input);
          if (Math.floor(i / 3) % 2 === Math.floor(j / 3) % 2) {
            cell.classList.add("alternate");
          }
          row.appendChild(cell);
        }
        table.appendChild(row);
      }
      // Set focus to the first input field when the webpage loads
      document.getElementById("cell-0-0").focus();
      document.getElementById("solve").addEventListener("click", function () {
        const grid = [];
        for (let i = 0; i < 9; i++) {
          const row = [];
          for (let j = 0; j < 9; j++) {
            const value = document.getElementById(`cell-${i}-${j}`).value;
            row.push(value ? parseInt(value, 10) : 0);
          }
          grid.push(row);
        }

        if (!isValidSudoku(grid)) {
          alert("The Sudoku is not valid");
          return;
        }

        if (solveSudoku(grid)) {
          for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
              document.getElementById(`cell-${i}-${j}`).value = grid[i][j];
            }
          }
        } else {
          alert("The Sudoku cannot be solved");
        }
      });

      function isValidSudoku(grid) {
        for (let i = 0; i < 9; i++) {
          const row = new Set();
          const col = new Set();
          const box = new Set();

          for (let j = 0; j < 9; j++) {
            if (grid[i][j] !== 0) {
              if (row.has(grid[i][j])) {
                return false;
              }
              row.add(grid[i][j]);
            }

            if (grid[j][i] !== 0) {
              if (col.has(grid[j][i])) {
                return false;
              }
              col.add(grid[j][i]);
            }

            const boxRow = 3 * Math.floor(i / 3) + Math.floor(j / 3);
            const boxCol = 3 * (i % 3) + (j % 3);
            if (grid[boxRow][boxCol] !== 0) {
              if (box.has(grid[boxRow][boxCol])) {
                return false;
              }
              box.add(grid[boxRow][boxCol]);
            }
          }
        }

        return true;
      }

      function solveSudoku(grid, row = 0, col = 0) {
        if (row === 9) {
          return true;
        }

        if (col === 9) {
          return solveSudoku(grid, row + 1, 0);
        }

        if (grid[row][col] !== 0) {
          return solveSudoku(grid, row, col + 1);
        }

        for (let num = 1; num <= 9; num++) {
          if (isValid(grid, row, col, num)) {
            grid[row][col] = num;

            if (solveSudoku(grid, row, col + 1)) {
              return true;
            }

            grid[row][col] = 0;
          }
        }

        return false;
      }

      function isValid(grid, row, col, num) {
        for (let i = 0; i < 9; i++) {
          if (grid[i][col] === num) {
            return false;
          }

          if (grid[row][i] === num) {
            return false;
          }

          if (
            grid[3 * Math.floor(row / 3) + Math.floor(i / 3)][
              3 * Math.floor(col / 3) + (i % 3)
            ] === num
          ) {
            return false;
          }
        }

        return true;
      }
      document.getElementById("clear").addEventListener("click", function () {
        for (let i = 0; i < 9; i++) {
          for (let j = 0; j < 9; j++) {
            const cell = document.getElementById(`cell-${i}-${j}`);
            cell.value = "";
            cell.readOnly = false; // unlock clues so manual entry works again
          }
        }
        document.getElementById("cell-0-0").focus();
      });

      // Generate a fresh random puzzle using the (now-fixed) generator (P4.7).
      document
        .getElementById("generate")
        .addEventListener("click", function () {
          if (!window.SudokuGenerator) {
            alert("Puzzle generator failed to load.");
            return;
          }
          const puzzle = window.SudokuGenerator.generatePuzzle();
          for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
              const cell = document.getElementById(`cell-${i}-${j}`);
              const value = puzzle[i][j];
              cell.value = value ? value : "";
              cell.readOnly = value !== 0; // lock generated clues
            }
          }
          document.getElementById("cell-0-0").focus();
        });
    </script>
