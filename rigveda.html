<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme FOUC guard — must run before the stylesheet (class-based dark mode) -->
    <script>
      (function(){var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.classList.add('dark');})();
    </script>

    <title>Rigveda Wheel — Chaitanya Malhotra</title>
    <meta name="description" content="Rigveda Simplified — an interactive 3D wheel of the ten Mandalas of the Rigveda, built with Three.js. Explore each mandal with audio, video, and original text." />
    <meta property="og:title" content="Rigveda Wheel — Chaitanya Malhotra" />
    <meta property="og:description" content="An interactive 3D wheel of the ten Mandalas of the Rigveda, built with Three.js." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chaitanyamalhotra.com/rigveda" />
    <link rel="canonical" href="https://chaitanyamalhotra.com/rigveda" />

    <!-- Shared brand system: tokens, nav, fonts (Space Grotesk + JetBrains Mono) -->
    <link rel="stylesheet" href="/assets/site.css" />

    <style>
      /*
         Rigveda is an inherently-dark, fullscreen 3D space scene, so the
         canvas/app context stays #000 regardless of light/dark theme.
         Chrome (nav) and typography still consume the shared brand tokens.
      */
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #000;                /* space scene — always dark */
        overflow: hidden;
        font-family: var(--font-display);/* Space Grotesk (was Papyrus) */
      }
      #app { position: fixed; inset: 0; }
      .hint {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        color: #f0f0f0;                  /* neutral ink on dark */
        font-family: var(--font-display);
        font-size: 12px; opacity: 0.8; text-align: center; pointer-events: none;
      }
      .gallery {
        position: fixed; inset: 0; background: rgba(0,0,0,0.9);
        display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      }
      .gallery.active { display: flex; }
      .gallery .title {
        color: #fff;
        font: 600 18px/1.2 var(--font-display);
      }
      .gallery .images {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px; width: min(1200px, 92vw); max-height: 70vh; overflow: auto;
      }
      .gallery img {
        width: 100%; height: 220px; object-fit: cover;
        border: 2px solid #2a2a2a;       /* brutalist 2px border, neutral */
        box-shadow: 4px 4px 0 0 rgba(0,0,0,0.6);
      }
      .gallery img:hover { border-color: var(--primary); } /* accent on hover */
      .gallery .close {
        position: absolute; top: 16px; right: 16px;
        background: #111; color: #fff;
        border: 2px solid #f0f0f0;       /* 2px border language */
        padding: 8px 10px; cursor: pointer;
        font-family: var(--font-mono);
        text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px;
      }
      .overlay-label {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        color: var(--primary);           /* accent — current mandal label */
        font: 700 16px/1.2 var(--font-display);
        letter-spacing: 0.08em; text-transform: uppercase;
      }
      .cam-panel {
        position: fixed; top: 10px; left: 10px;
        background: rgba(15,15,20,0.85);
        border: 2px solid #2a2a2a;       /* neutral surface border */
        padding: 10px 12px; color: #f0f0f0;
        font: 12px/1.3 var(--font-mono); /* technical control panel → mono */
        width: 280px; backdrop-filter: blur(4px);
      }
      .cam-panel h3 {
        margin: 0 0 8px;
        font: 600 13px/1.2 var(--font-display);
        color: #fff;
      }
      .cam-row { display: grid; grid-template-columns: 70px 1fr 52px; align-items: center; gap: 8px; margin: 6px 0; }
      .cam-row label { color: #cfd8dc; }
      .cam-row input[type="range"] { width: 100%; }
      .cam-val { text-align: right; color: var(--primary); min-width: 40px; } /* accent for readouts */
    </style>
  </head>
  <body>
    <header class="site-nav">
      <a class="site-nav__brand" href="/">CHAITANYA_MALHOTRA</a>
      <nav class="site-nav__links">
        <a href="/">← HOME</a>
        <a href="https://github.com/bhoot1234567890" target="_blank" rel="noopener">GITHUB ↗</a>
      </nav>
    </header>
    <div id="overlay">
      <h1 id="title">Rigveda Simplified</h1>
      <button id="start-btn">Start</button>
    </div>
    <div id="app"></div>
  <!-- Import map to allow bare specifiers like 'three' to resolve to CDN modules -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
        "three/": "https://unpkg.com/three@0.159.0/"
      }
    }
    </script>
    <script type="module" src="./src/main.js"></script>
    <!-- Player assets loaded from src/ for better separation of concerns -->
    <link rel="stylesheet" href="./src/player.css">
    <div id="audio-player-container" aria-hidden="false"></div>
    <script type="module" src="./src/player.js"></script>
    <style>
      /* Start screen overlay — brutalist brand treatment (2px border + offset shadow) */
      #overlay {
        position: absolute;
        top: 0; left: 0; right: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }
      #title {
        margin-top: 3vw;
        font-size: 5vw;
        font-family: var(--font-display);   /* Space Grotesk (was Papyrus) */
        color: #fff;                        /* neutral ink on dark */
        text-shadow: none;                  /* brutalist: hard edge, no glow */
        letter-spacing: 0.04em;
        font-weight: 700;
        text-transform: uppercase;
        pointer-events: none;
        user-select: none;
      }
      #start-btn {
        margin-top: auto;
        margin-bottom: 10vh;
        font-size: 1.7vw;
        padding: 0.9vw 2.4vw;
        border: 2px solid var(--primary);   /* brutalist 2px accent border */
        border-radius: 0;                   /* sharp corners */
        background: transparent;
        color: #fff;                        /* text-on-accent is white, never black */
        font-family: var(--font-mono);      /* industrial/technical button face */
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        cursor: pointer;
        pointer-events: auto;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      }
      #start-btn:hover {
        background: var(--primary);         /* fill accent on hover */
        color: #fff;
        box-shadow: 6px 6px 0 0 #fff;       /* signature offset shadow (white reads on black) */
      }
      #start-btn:active {
        transform: translate(3px, 3px);     /* press-in */
        box-shadow: 3px 3px 0 0 #fff;
      }
    </style>
    <style>
      /* Responsive tweaks for mobile / small screens */
      @media (max-width: 520px) {
        /* make the big start button more tappable */
        #start-btn {
          font-size: 5.6vw; /* larger relative size */
          padding: 3.2vw 6vw;
          border-radius: 0;            /* brutalist: sharp corners (was 3.2vw) */
          margin-bottom: 8vh;
        }

        /* Ensure the overlay title is not massive on very small screens */
        #title { font-size: 8vw; margin-top: 6vw; }

        /* Make mandal overlay content fit on narrow screens and allow scrolling */
        #mandal-overlay-content {
          max-width: 92vw !important;
          width: 92vw !important;
          padding: 28px 18px !important;
          box-sizing: border-box;
        }

        /* Larger, finger-friendly buttons inside overlays */
        #mandal-overlay-content button,
        #mandal-overlay-content a {
          font-size: 16px !important;
          padding: 12px 16px !important;
          border-radius: 10px !important;
        }

        /* Make video scale better on small screens */
        #mandal-overlay-content video {
          max-height: 50vh !important;
          width: 100% !important;
          height: auto !important;
        }

        /* Gallery thumbnails: slightly larger and responsive */
        #mandal-overlay-content img {
          width: 28vw !important;
          height: auto !important;
          max-width: 160px !important;
        }
      }

      /* Desktop tweaks: ensure overlay content is centered horizontally */
      @media (min-width: 521px) {
        #mandal-overlay-content { max-width: 640px; }
      }
    </style>
    <!-- P3.1: branded "INITIALIZING 3D…" loading state.
         Shown when Start is clicked; hidden once the scene entrance settles.
         main.js starts its requestAnimationFrame loop at module load and emits
         no first-frame event, and we cannot edit src/main.js, so the reliable,
         least-invasive trigger is a render-frame counter that tracks the real
         camera fly-in entrance (it auto-pauses if the tab is hidden), with a
         wall-clock safety cap and a future-proof 'rigveda:firstframe' listener.
         A fixed timeout was rejected: the scene presents in ~1s, so a 4s timer
         would linger over an already-rendered scene. -->
    <div id="rigveda-loading" aria-live="polite" role="status" hidden>
      <span class="rigveda-loading__label">INITIALIZING 3D…</span>
    </div>
    <style>
      #rigveda-loading {
        position: fixed; inset: 0; z-index: 60;
        display: flex; align-items: center; justify-content: center;
        background: #000;
        font-family: var(--font-mono);
      }
      #rigveda-loading[hidden] { display: none; }
      .rigveda-loading__label {
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 14px 22px;
        border: 2px solid var(--primary);
        box-shadow: 6px 6px 0 0 var(--primary);
      }
      /* Pulsing accent dot while initializing (respects reduced-motion via site.css) */
      .rigveda-loading__label::before {
        content: "";
        display: inline-block;
        width: 8px; height: 8px; margin-right: 12px;
        background: var(--primary);
        vertical-align: middle;
        animation: rigveda-pulse 0.9s steps(2, end) infinite;
      }
      @keyframes rigveda-pulse { 50% { opacity: 0.2; } }
    </style>
    <script>
      (function () {
        var loading = document.getElementById('rigveda-loading');
        if (!loading) return;
        var capTimer = null;
        var framesLeft = 60;

        function hideLoading() {
          if (capTimer) { clearTimeout(capTimer); capTimer = null; }
          loading.hidden = true;
        }

        function frameHide() {
          // Primary trigger: count real render frames so the indicator tracks
          // the actual camera fly-in entrance (rAF pauses while tab hidden).
          if (--framesLeft <= 0) { hideLoading(); return; }
          requestAnimationFrame(frameHide);
        }

        function showLoading() {
          if (!loading.hidden) return;
          loading.hidden = false;
          framesLeft = 60;                 // ~1s @60fps; adapts to device rate
          requestAnimationFrame(frameHide);
          capTimer = setTimeout(hideLoading, 5000); // absolute wall-clock safety net
        }

        // Show on Start (mouse path) and on Enter from the start screen (keyboard path).
        var startBtn = document.getElementById('start-btn');
        if (startBtn) startBtn.addEventListener('click', showLoading);
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          var ov = document.getElementById('overlay');
          if (ov && ov.style.pointerEvents !== 'none') showLoading();
        });

        // Future-proof: hide instantly if main.js ever dispatches a real first-frame signal.
        document.addEventListener('rigveda:firstframe', hideLoading);
      })();
    </script>
  </body>
</html>
