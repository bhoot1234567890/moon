<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 — Chaitanya Malhotra</title>
<link rel="icon" href="assets/favicon-e8397ea4.svg" type="image/svg+xml"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: { extend: { colors: { "primary": "rgb(var(--primary) / <alpha-value>)", "background-light": "#cccccc", "background-dark": "#212121" }, fontFamily: { "display": ["Space Grotesk", "monospace"] } } }
  }
</script>
<style>:root { --primary: 214 61 0; }</style>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="bg-background-light dark:bg-background-dark text-black dark:text-gray-100 font-display min-h-screen flex items-center justify-center">
<div class="text-center p-8">
<h1 class="text-8xl font-bold uppercase tracking-tight text-primary">404</h1>
<p class="text-lg font-mono mt-4 opacity-70">Signal lost. This page drifted into deep space.</p>
<a href="/" class="inline-block mt-8 border-2 border-black dark:border-white px-6 py-3 font-bold uppercase tracking-widest hover:bg-primary hover:text-black transition-colors">Return Home</a>
</div>
<script>
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
</script>
</body>
</html>
